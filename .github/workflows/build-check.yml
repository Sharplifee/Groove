name: Build check

# Compiles the app on a real macOS runner with a real Xcode. No signing, no
# upload, no device — the only question this answers is whether the code
# actually builds, which is the question that cannot be answered anywhere
# except on an Apple machine.
#
# Simulator SDK with signing disabled, so it needs no certificates, no
# provisioning profiles and no secrets. Building the iOS scheme also builds the
# embedded watch app, so one run covers both targets.
#
# macOS runners bill at 10x. A clean build here is a few minutes; the
# concurrency group cancels superseded runs so a burst of pushes doesn't stack.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: build-check
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.3"
      - name: Run the logic harness
        run: |
          chmod +x Tests/run-checks.sh
          ./Tests/run-checks.sh

  build:
    needs: checks
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      # Generic destination, not a named device. Runner images rotate their
      # installed simulators, so naming one ties this workflow to whatever
      # iPhone happened to ship with that image — macos-26 has no iPhone 16 Pro
      # and the run dies with "Unable to find a device matching the provided
      # destination specifier".
      #
      # NOTE: do not add `-sdk iphonesimulator` here. It overrides the SDK for
      # every target in the scheme including the embedded watch app, so watchOS
      # code gets compiled against the iOS SDK and HealthKit's workout types
      # come back "unavailable in iOS". The destination alone picks the right
      # SDK per target.
      - name: Build iPhone + Watch
        run: |
          set -o pipefail
          xcodebuild build \
            -project Groove.xcodeproj \
            -scheme Groove \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log

      - name: Collect diagnostics
        if: always()
        run: |
          echo "### Errors" >> $GITHUB_STEP_SUMMARY
          grep -E "error:" build.log | sort -u | head -100 >> $GITHUB_STEP_SUMMARY || \
            echo "none" >> $GITHUB_STEP_SUMMARY
          echo "### Warnings" >> $GITHUB_STEP_SUMMARY
          grep -E "warning:" build.log | sort -u | head -60 >> $GITHUB_STEP_SUMMARY || \
            echo "none" >> $GITHUB_STEP_SUMMARY

      - name: Upload build log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
