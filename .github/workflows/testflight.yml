name: TestFlight

# Push to main → Build check runs the harness and compiles → this ships.
#
# Signing model: ONE persistent distribution certificate (shared across this
# team's iOS pipelines), imported from a .p12 in secrets, with two App Store
# provisioning profiles minted once against it — the phone app and the embedded
# watch app. Manual signing, no -allowProvisioningUpdates.
#
# This deliberately replaces the old mint-on-every-run model. That model minted
# a fresh certificate on each ephemeral runner, whose private key died with the
# runner, so it needed a prune step to clear the orphans before Apple's
# per-team cap jammed the pipeline — and that prune repeatedly revoked OTHER
# apps' certificates on the same team (squad-comms, scribbly, momentum,
# nearfield, parking-sentry). With a persistent cert there are no orphans, no
# prune, no ownership bookkeeping, and no way for this repo to touch another
# project's signing. See DECISIONS 44.

on:
  workflow_run:
    workflows: ["Build check"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-26
    timeout-minutes: 45

    env:
      SCHEME: Groove
      TEAM_ID: ${{ secrets.TEAM_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Set build number
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          pip3 install --quiet --break-system-packages pyjwt cryptography
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8" | base64 --decode > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          NEXT=$(python3 - <<'PYNUM'
          import json, os, time, urllib.request, jwt
          kid, iss = os.environ["ASC_KEY_ID"], os.environ["ASC_ISSUER_ID"]
          key = open(os.path.expanduser(f"~/private_keys/AuthKey_{kid}.p8")).read()
          tok = jwt.encode({"iss": iss, "iat": int(time.time()), "exp": int(time.time())+900,
                            "aud": "appstoreconnect-v1"}, key, algorithm="ES256", headers={"kid": kid})
          req = urllib.request.Request(
              "https://api.appstoreconnect.apple.com/v1/builds?filter[app]=6801063220&sort=-version&limit=200",
              headers={"Authorization": "Bearer " + tok})
          data = json.loads(urllib.request.urlopen(req).read()).get("data", [])
          highest = 0
          for b in data:
              try: highest = max(highest, int(b["attributes"]["version"]))
              except (ValueError, TypeError): pass
          # Never below the CI run number either, so numbers only ever climb.
          print(max(highest, int(os.environ.get("GITHUB_RUN_NUMBER", "0"))) + 1)
          PYNUM
          )
          echo "Next build number: $NEXT"
          echo "BUILD_NUMBER=$NEXT" >> "$GITHUB_ENV"
          agvtool new-version -all "$NEXT"

      - name: Import signing certificate
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          echo "$DIST_CERT_P12" | base64 --decode > /tmp/dist.p12
          security create-keychain -p runner build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security default-keychain -s build.keychain
          security list-keychains -d user -s build.keychain login.keychain-db
          security unlock-keychain -p runner build.keychain
          # A fresh keychain has no WWDR intermediate, so a valid leaf reports
          # "certificate is invalid ... revoked or expired". Import it first.
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o /tmp/wwdr.cer
          security import /tmp/wwdr.cer -k build.keychain -T /usr/bin/codesign || true
          security import /tmp/dist.p12 -k build.keychain -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k runner build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Install provisioning profiles
        env:
          PROFILE_PHONE: ${{ secrets.PROFILE_PHONE }}
          PROFILE_WATCH: ${{ secrets.PROFILE_WATCH }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_PHONE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/groove-phone.mobileprovision
          echo "$PROFILE_WATCH" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/groove-watch.mobileprovision
          ls -l ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Groove.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Groove.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            2>&1 | tee archive.log

      - name: Export IPA
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.connor.groove</key><string>Groove CI Phone</string>
              <key>com.connor.groove.watchkitapp</key><string>Groove CI Watch</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Groove.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export
          ls -lh build/export

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8" | base64 --decode > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app --type ios \
            --file build/export/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Release the build to testers
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          pip3 install --quiet --break-system-packages pyjwt cryptography
          python3 - <<'RELEASE'
          import json, os, time, urllib.request, urllib.error, jwt
          kid, iss = os.environ["ASC_KEY_ID"], os.environ["ASC_ISSUER_ID"]
          key = open(os.path.expanduser(f"~/private_keys/AuthKey_{kid}.p8")).read()
          tok = jwt.encode({"iss": iss, "iat": int(time.time()), "exp": int(time.time())+1800,
                            "aud": "appstoreconnect-v1"}, key, algorithm="ES256", headers={"kid": kid})
          BASE = "https://api.appstoreconnect.apple.com"
          def call(m, p, b=None):
              data = json.dumps(b).encode() if b else None
              r = urllib.request.Request(BASE+p, data=data, method=m,
                  headers={"Authorization":"Bearer "+tok, "Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(r) as resp:
                      raw = resp.read(); return json.loads(raw) if raw else None
              except urllib.error.HTTPError as e:
                  print(f"   !! {m} {p} -> {e.code}: {e.read().decode()[:300]}"); return None
          from datetime import datetime, timezone
          APP, VERSION = "6801063220", os.environ.get("BUILD_NUMBER","")
          target = None
          for _ in range(30):
              builds = call("GET", f"/v1/builds?filter[app]={APP}&sort=-version&limit=5")
              for b in (builds or {}).get("data", []):
                  if b["attributes"]["version"] != VERSION: continue
                  # Guard against shipping a stale build that happens to share
                  # this number: it must have landed just now, not hours ago.
                  up = b["attributes"].get("uploadedDate","")
                  try:
                      age = (datetime.now(timezone.utc) - datetime.fromisoformat(up)).total_seconds()
                  except Exception:
                      age = 1e9
                  if age > 1200:
                      raise SystemExit(f"build {VERSION} exists but is {int(age)}s old — "
                                       "this run's upload did not register (duplicate number?)")
                  target = b; break
              if target and target["attributes"]["processingState"] == "VALID": break
              print("   waiting for build", VERSION,
                    target["attributes"]["processingState"] if target else "not visible")
              target = None; time.sleep(30)
          if not target: raise SystemExit(f"build {VERSION} never became VALID")

          # Two kinds of beta group, and they release completely differently.
          #  - EXTERNAL groups take an explicit build assignment (POST builds).
          #  - INTERNAL groups REJECT that POST ("Builds cannot be assigned to
          #    this internal group", 422) and instead surface every build to
          #    their testers automatically WHEN the group was created with
          #    hasAccessToAllBuilds — a create-only flag that cannot be PATCHed
          #    on afterwards. An internal group without it silently shows the
          #    testers nothing, which is how a green run shipped no build twice.
          # So: assign to external groups, and for internal availability assert
          # the build's own state rather than a group attachment that is either
          # impossible or automatic.
          externals = []
          for g in call("GET", f"/v1/betaGroups?filter[app]={APP}")["data"]:
              if g["attributes"].get("isInternalGroup"): continue
              call("POST", f"/v1/betaGroups/{g['id']}/relationships/builds",
                   {"data":[{"type":"builds","id":target["id"]}]})
              externals.append(g["attributes"]["name"])
              print("   assigned to external group", g["attributes"]["name"])

          # The real proof for internal testers: the build has entered beta
          # testing. VALID alone is not enough; compliance or review can hold a
          # VALID build out of testers' hands.
          detail = call("GET", f"/v1/builds/{target['id']}/buildBetaDetail")
          state = ((detail or {}).get("data") or {}).get("attributes", {}).get("internalBuildState")
          print("   internalBuildState =", state)
          if state != "IN_BETA_TESTING":
              raise SystemExit(f"build {VERSION} is {state}, not IN_BETA_TESTING — "
                               "not actually available to internal testers")
          print(f"== build {VERSION} IN_BETA_TESTING; external groups: {externals or 'none'} ==")
          RELEASE

      - name: Clean up
        if: always()
        run: rm -rf ~/private_keys

      - name: Diagnostics
        if: always()
        run: grep -E "error:" archive.log | sort -u | head -60 >> $GITHUB_STEP_SUMMARY || echo "none" >> $GITHUB_STEP_SUMMARY
