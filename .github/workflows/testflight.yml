name: TestFlight

# Push to main → build → sign → TestFlight.
#
# The previous version of this file needed a distribution certificate as a .p12
# plus two provisioning profiles, all base64'd into secrets. None of those were
# ever added, so every run since this repo existed died at "Import signing
# certificate" without once reaching the compiler.
#
# It doesn't need them. Xcode can authenticate to Apple with an App Store
# Connect API key and mint the certificate and profiles on the runner itself
# (-allowProvisioningUpdates plus -authenticationKey*). That reduces the secret
# list to the API key, which already existed in the credentials store.
#
# Requires an App Store Connect app record for com.connor.groove. Apple forbids
# creating one over the API — POST /v1/apps returns 403 FORBIDDEN_ERROR, "the
# resource 'apps' does not allow 'CREATE'" — so that one step is done by hand,
# once, in the App Store Connect UI.
#
# macOS runners bill at 10x, so the concurrency group cancels superseded runs.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    env:
      SCHEME: Groove
      TEAM_ID: ${{ secrets.TEAM_ID }}

    steps:
      - uses: actions/checkout@v4

      # Apple rejects uploads built against anything older than the iOS 26 SDK:
      # "This app was built with the iOS 18.5 SDK. All iOS and iPadOS apps must
      # be built with the iOS 26 SDK or later." Pick the newest Xcode present
      # rather than pinning a version that will age out again.
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "using $NEWEST"
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      # Run number as the build number so TestFlight never rejects a duplicate.
      - name: Set build number
        run: agvtool new-version -all ${{ github.run_number }}

      - name: Install App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8" | base64 --decode > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      # Every run of this workflow lands on a fresh ephemeral runner, and
      # -allowProvisioningUpdates mints a new signing certificate there whose
      # private key dies with the runner minutes later. Apple caps certificates
      # per team, so after a handful of runs the whole pipeline jams on
      # "maximum number of certificates". Those orphans are unusable by
      # definition — the keys are gone — so each run clears the deck first and
      # then mints exactly what it needs. If a local Xcode ever signs on this
      # team it simply re-creates its certificate on next build, same as CI.
      - name: Prune orphaned signing certificates
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          pip3 install --quiet --break-system-packages pyjwt cryptography
          python3 - <<'PRUNE'
          import json, os, time, urllib.request, jwt
          kid, iss = os.environ["ASC_KEY_ID"], os.environ["ASC_ISSUER_ID"]
          key = open(os.path.expanduser(f"~/private_keys/AuthKey_{kid}.p8")).read()
          tok = jwt.encode({"iss": iss, "iat": int(time.time()),
                            "exp": int(time.time()) + 1200,
                            "aud": "appstoreconnect-v1"},
                           key, algorithm="ES256", headers={"kid": kid})
          H = {"Authorization": "Bearer " + tok}
          def call(method, path):
              r = urllib.request.Request(
                  "https://api.appstoreconnect.apple.com" + path,
                  headers=H, method=method)
              with urllib.request.urlopen(r) as resp:
                  return json.load(resp) if method == "GET" else None
          certs = call("GET", "/v1/certificates?limit=200")["data"]
          doomed = [c for c in certs if c["attributes"]["certificateType"]
                    in ("DEVELOPMENT", "DISTRIBUTION", "IOS_DEVELOPMENT",
                        "IOS_DISTRIBUTION")]
          for c in doomed:
              call("DELETE", "/v1/certificates/" + c["id"])
              print("revoked", c["attributes"]["certificateType"],
                    c["attributes"].get("displayName", ""), c["id"])
          print(f"{len(doomed)} orphaned certificate(s) cleared")
          PRUNE

      # No -sdk here. It would override the SDK for every target in the scheme
      # including the embedded watch app, and watchOS sources would compile
      # against iOS. The destination resolves the right SDK per target.
      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Groove.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Groove.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            2>&1 | tee archive.log

      - name: Export IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/Groove.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file build/export/*.ipa \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Diagnostics
        if: always()
        run: |
          echo "### Errors" >> $GITHUB_STEP_SUMMARY
          grep -E "error:" archive.log | sort -u | head -60 >> $GITHUB_STEP_SUMMARY || \
            echo "none" >> $GITHUB_STEP_SUMMARY

      # Uploading is not releasing. A build can sit VALID in App Store Connect
      # indefinitely and never appear in TestFlight because nothing attached it
      # to a beta group — which is exactly what happened to builds 21 through
      # 32: all uploaded, all valid, none visible, the tester stuck on build 20
      # for days while "upload succeeded" was reported every time. Assignment
      # is now part of shipping, and the step fails loudly if it doesn't stick.
      - name: Release the build to testers
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          pip3 install --quiet --break-system-packages pyjwt cryptography
          python3 - <<'RELEASE'
          import json, os, time, urllib.request, urllib.error, jwt
          kid, iss = os.environ["ASC_KEY_ID"], os.environ["ASC_ISSUER_ID"]
          key = open(os.path.expanduser(f"~/private_keys/AuthKey_{kid}.p8")).read()
          tok = jwt.encode({"iss": iss, "iat": int(time.time()),
                            "exp": int(time.time()) + 1800,
                            "aud": "appstoreconnect-v1"},
                           key, algorithm="ES256", headers={"kid": kid})
          BASE = "https://api.appstoreconnect.apple.com"
          def call(method, path, body=None):
              data = json.dumps(body).encode() if body else None
              r = urllib.request.Request(BASE + path, data=data, method=method,
                                         headers={"Authorization": "Bearer " + tok,
                                                  "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(r) as resp:
                      raw = resp.read()
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as e:
                  print(f"   !! {method} {path} -> {e.code}: {e.read().decode()[:300]}")
                  return None

          APP, VERSION = "6801063220", os.environ.get("GITHUB_RUN_NUMBER", "")
          # Processing takes a few minutes after upload; wait for this build.
          target = None
          for attempt in range(30):
              builds = call("GET", f"/v1/builds?filter[app]={APP}&sort=-version&limit=5")
              for b in (builds or {}).get("data", []):
                  if b["attributes"]["version"] == VERSION:
                      target = b
                      break
              if target and target["attributes"]["processingState"] == "VALID":
                  break
              print(f"   waiting for build {VERSION} to finish processing "
                    f"({target['attributes']['processingState'] if target else 'not visible yet'})")
              target = None
              time.sleep(30)
          if not target:
              raise SystemExit(f"build {VERSION} never became VALID — nothing released")

          groups = call("GET", f"/v1/betaGroups?filter[app]={APP}")["data"]
          for g in groups:
              call("POST", f"/v1/betaGroups/{g['id']}/relationships/builds",
                   {"data": [{"type": "builds", "id": target["id"]}]})
              print(f"   attached to {g['attributes']['name']}")

          # Verify from the group side — Apple forbids the build-side query.
          landed = []
          for g in groups:
              gb = call("GET", f"/v1/betaGroups/{g['id']}/builds?limit=200")
              if any(b["id"] == target["id"] for b in (gb or {}).get("data", [])):
                  landed.append(g["attributes"]["name"])
          print(f"== build {VERSION} released to: {landed or 'NOTHING'} ==")
          if not landed:
              raise SystemExit("build uploaded but not released to any group")
          RELEASE

      - name: Clean up the key
        if: always()
        run: rm -rf ~/private_keys

      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: archive.log
          retention-days: 3
