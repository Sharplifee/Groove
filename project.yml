name: Groove

options:
  bundleIdPrefix: com.connor
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"

settings:
  base:
    # Pinned deliberately. Swift 6 language mode turns this codebase's
    # nonisolated WCSession delegates and [String: Any] payload hops into a
    # wall of Sendable errors, and every "fix" would rewrite the concurrency
    # behaviour the README says was hard-won.
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: XF783932R2
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"

targets:

  Groove:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Groove/Shared
      - path: Groove/Phone
    settings:
      base:
        PRODUCT_NAME: Groove
        PRODUCT_BUNDLE_IDENTIFIER: com.connor.groove
        INFOPLIST_FILE: Support/Groove-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # 1,2 = iPhone and iPad. The iPad build runs the read-only second
        # screen (PairedDeviceView), not the tab bar.
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: Groove Watch App
        embed: true
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"

  Groove Watch App:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: Groove/Shared
      - path: Groove/Watch
    settings:
      base:
        PRODUCT_NAME: Groove Watch App
        PRODUCT_BUNDLE_IDENTIFIER: com.connor.groove.watchkitapp
        INFOPLIST_FILE: Support/GrooveWatch-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Support/GrooveWatch.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
